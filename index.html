function dues(k,to){const A=k=='r'?['invoice']:['bill','stockc'],B=k=='r'?['rcpt']:['pay'],m={};S.tx.forEach(t=>{if(to&&t.date>to)return;if(A.includes(t.type))m[t.party]=(m[t.party]||0)+ +t.amt;if(B.includes(t.type))m[t.party]=(m[t.party]||0)-+t.amt;if((t.credit&&((k=='r'&&t.type=='retin')||(k=='p'&&t.type=='retout')))||(k=='r'&&t.type=='loss'&&t.kind=='baddebt'))m[t.party]=(m[t.party]||0)-+t.amt});return Object.entries(m).filter(([,v])=>Math.abs(v)>.004)}

function grnCost(g){const p=S.preq.find(x=>x.id==g.preq);if(!p)return 0;const L=S.tx.filter(t=>!t._pos&&t.appr==p.id&&(t.type=='stock'||t.type=='stockc')),q=sum(L.map(t=>+t.qty)),a=sum(L.map(t=>+t.amt)),u=q>0?a/q:(+p.unit||(+p.qty?p.est/p.qty:0));return u*(+g.qty||0)}
function invItems(to){const mk=n=>m[n]=m[n]||{name:n,q:0,c:0,cq:null,cd:'',after:[],rin:[],lost:[]};const m={};S.tx.forEach(t=>{if(!t.item||(to&&t.date>to))return;const o=mk(t.item);if(t.type=='stock'||t.type=='stockc'||t.type=='stockcap'){if(!procLinked(t)){o.q+=+t.qty;o.c+=+t.amt;o.after.push([t.date,+t.qty])}}else if(t.type=='retout'){o.q-=+t.qty;o.c-=+t.amt;o.after.push([t.date,-(+t.qty)])}else if(t.type=='retin'){o.rin.push([t.date,+t.qty])}else if(t.type=='loss'){o.lost.push([t.date,+t.qty])}else if(t.type=='count'&&(!o.cd||t.date>=o.cd)){o.cq=+t.qty;o.cd=t.date}});
 S.grn.forEach(g=>{if(!g.item||(to&&g.date>to))return;const o=mk(g.item);o.q+=+g.qty;o.c+=grnCost(g);o.after.push([g.date,+g.qty])});
 return Object.values(m).map(o=>{o.avg=o.q?o.c/o.q:0;o.cut=o.cq==null?'':o.cd;o.base=-sum(o.lost.filter(a=>!o.cut||a[0]>o.cut).map(a=>a[1]))+(o.cq==null?o.q+sum(o.rin.map(a=>a[1])):o.cq+sum(o.after.filter(a=>a[0]>o.cd).map(a=>a[1]))+sum(o.rin.filter(a=>a[0]>o.cd).map(a=>a[1])));o.sold=soldAfter(o.name,o.cut,to);o.onhand=o.base-o.sold;o.val=Math.max(0,o.onhand)*o.avg;return o}).sort((a,b)=>a.name.localeCompare(b.name))}

const loanBal=(id,to)=>sum(S.tx.filter(t=>t.loan==id&&(!to||t.date<=to)).map(t=>t.type=='loanin'?+t.amt:t.type=='loanpay'?-t.amt:0));

 const ti=sum(Object.values(inc)),te=sum(Object.values(exp)),beg=from?invVal(prevDay(from)):0,pur=sum(L.filter(t=>t.type=='stock'||t.type=='stockc').map(t=>+t.amt)),intro=sum(L.filter(t=>t.type=='stockcap').map(t=>+t.amt)),end=invVal(to),lossO={},sr=sum(L.filter(t=>t.type=='retin').map(t=>+t.amt)),pr=sum(L.filter(t=>t.type=='retout').map(t=>+t.amt)),cogs=beg+pur-pr+intro-end,gp=ti-sr-cogs;L.forEach(t=>{if(t.type=='loss'&&t.kind!='stock')lossO[t.kind]=(lossO[t.kind]||0)+ +t.amt});const lt=sum(Object.values(lossO)),ls=sum(L.filter(t=>t.type=='loss'&&t.kind=='stock').map(t=>+t.amt));

function custAcc(name){const T=TD(),c=custInfo(name),srt=(a,b)=>a.date.localeCompare(b.date)||a.id-b.id;
 const inv=S.tx.filter(t=>t.type=='invoice'&&t.party==name).sort(srt).map(t=>({date:t.date,due:t.due||addDays(t.date,c.days),amt:+t.amt,rem:+t.amt,chunks:[]})),rc=S.tx.filter(t=>t.type=='rcpt'&&t.party==name).sort(srt);
 const cns=S.tx.filter(t=>((t.type=='retin'&&t.credit)||(t.type=='loss'&&t.kind=='baddebt'))&&t.party==name).sort(srt);inv.forEach(v=>v.cn=0);cns.forEach(r=>{let a=+r.amt;for(const v of inv){if(a<=.004)break;if(v.rem<=.004)continue;const x=Math.min(a,v.rem);v.rem-=x;v.cn+=x;a-=x}});
 rc.forEach(r=>{let a=+r.amt;for(const v of inv){if(a<=.004)break;if(v.rem<=.004)continue;const x=Math.min(a,v.rem);v.rem-=x;a-=x;v.chunks.push({d:r.date,a:x})}});
 let onT=0,dueAmt=0,lateAmt=0,lateW=0,overdue=0,oldest=0;const late=[];
 inv.forEach(v=>{const paid=v.rem<=.004,last=v.chunks.length?v.chunks[v.chunks.length-1].d:null;
  if(paid){v.state='paid';v.days=Math.max(0,last?dd(last,v.due):0)}else if(v.due<T){v.state='overdue';v.days=dd(T,v.due)}else{v.state='open';v.days=dd(v.due,T)}
  if(paid||v.due<T){dueAmt+=v.amt-v.cn;v.chunks.forEach(k=>{if(k.d<=v.due)onT+=k.a;else{lateAmt+=k.a;lateW+=k.a*dd(k.d,v.due)}});
   if(!paid){const dl=dd(T,v.due);lateAmt+=v.rem;lateW+=v.rem*dl;overdue+=v.rem;oldest=Math.max(oldest,dl)}
   if(v.chunks.some(k=>k.d>v.due)||!paid){const end=paid?last:T;late.push(c.notes.some(n=>n.kind=='customer'&&n.date>=addDays(v.due,-7)&&n.date<=end))}}});
 const out=sum(inv.map(v=>v.amt))-sum(rc.map(r=>+r.amt))-sum(cns.map(r=>+r.amt)),avgLate=lateAmt?lateW/lateAmt:0;
 const pay=dueAmt>0?0.7*(onT/dueAmt)+0.3*(lateAmt?1-Math.min(avgLate,90)/90:1):null,comm=late.length?late.filter(Boolean).length/late.length:null;

 return{name,c,inv,out,overdue,oldest,score,g,pay,comm,prom,avgLate,onTimePct:dueAmt>0?onT/dueAmt:null,late,prs,since:c.since||(inv[0]?inv[0].date:'')}}

async function delLoan(id){if(await askYes('Delete this loan and all its entries?')){S.loans=S.loans.filter(l=>l.id!=id);S.tx=S.tx.filter(t=>t.loan!=id);save();show()}}
async function payInst(id,k){const l=S.loans.find(x=>x.id==id),s=sched(l)[k-1],a=await askSel('Pay instalment '+k+' ('+f(s.pay)+') from',S.accounts);if(!a)return;S.tx.push({id:nid(),date:new Date().toISOString().slice(0,10),type:'loanpay',acct:a,amt:+s.p.toFixed(2),int:+s.i.toFixed(2),loan:id,inst:k,desc:'Instalment '+k});save();show()}
function askSel(t,o){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="mod"><h3 style="margin-top:0">${esc(t)}</h3><select id="ms">${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div class="seg" style="margin-top:12px"><button id="mc">Cancel</button><button class="on" id="mk">Pay</button></div></div>`;document.body.appendChild(d);d.querySelector('#mc').onclick=()=>{d.remove();r(null)};d.querySelector('#mk').onclick=()=>{const v=d.querySelector('#ms').value;d.remove();r(v)}})}
function partners(){const p=profit('','');const tr=sum(S.partners.map(x=>+x.ratio));
 return `<h1>Partners</h1><div class="card">${S.partners.map(x=>{const g=y=>sum(S.tx.filter(t=>t.type==y&&t.partner==x.id).map(t=>+t.amt)),c=g('capital')+g('stockcap'),d=g('drawing'),sp=g('salary'),se=salE(x,p),tot=share(x,p);
 return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row" style="border:0;padding:0"><b>${esc(x.name)}</b><span class="num">${x.ratio}%</span></div>
 <div class="mut">Agreed salary ${f(+x.salary||0)} per month · Due to date ${f(se)} · Paid ${f(sp)}</div>
 <div class="mut">Capital ${f(c)} · Drawings ${f(d)} · Profit share ${f(tot-se)}</div><div><b>Current balance ${f(c+tot-d-sp)}</b></div>
 <div class="seg" style="margin-top:6px"><button onclick="ren(${x.id})">Rename</button><button onclick="ratio(${x.id})">Change share %</button><button onclick="sal(${x.id})">Set salary</button></div></div>`}).join('')}
 ${Math.round(tr*100)!=10000?`<div class="warn">Profit shares add up to ${tr}%. They must total 100%.</div>`:''}</div>
 <button class="p" onclick="addP()">Add a partner</button>
 <p class="mut">Salaries are paid out of profit before it is shared. They count monthly from the first entry (or the report start date). Record each payment with Add → Salary paid. When a new partner joins, change everyone’s share % so the total is 100%.</p>
 <h2>Accounts &amp; data</h2><div class="seg"><button onclick="ex()">Download backup</button><button onclick="document.getElementById('imp').click()">Restore backup</button></div>
 <input id="imp" type="file" accept=".json" style="display:none" onchange="im(this)">${ADMIN?`<h2>Team and access</h2><div class="card" id="team">${teamHtml()}</div>`:''}<h2>Your account</h2><div class="card"><div>${esc(ME)}</div><div class="mut">${RO?'View-only access: you can look at everything and print reports. You cannot add, change or delete anything.':'Full access'}</div><div class="seg" style="margin-top:10px"><button onclick="chgPw()">Change password</button><button onclick="signOut()">Sign out</button></div></div>`}
function askText(t,v,ty){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="mod"><h3 style="margin-top:0">${esc(t)}</h3><input id="mi" type="${ty||'text'}" ${ty=='number'?'inputmode="decimal" step="any"':''} value="${esc(v??'')}"><div class="seg" style="margin-top:12px"><button id="mc">Cancel</button><button class="on" id="mk">OK</button></div></div>`;document.body.appendChild(d);const e=x=>{d.remove();r(x)},i=d.querySelector('#mi');d.querySelector('#mc').onclick=()=>e(null);d.querySelector('#mk').onclick=()=>e(i.value);i.onkeydown=ev=>{if(ev.key=='Enter')e(i.value)};i.focus()})}
function askYes(m){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="mod"><p style="margin-top:0">${esc(m)}</p><div class="seg"><button id="mc">Cancel</button><button class="on" id="mk">Yes</button></div></div>`;document.body.appendChild(d);d.querySelector('#mc').onclick=()=>{d.remove();r(false)};d.querySelector('#mk').onclick=()=>{d.remove();r(true)}})}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
async function ren(id){const p=S.partners.find(x=>x.id==id),n=await askText('Partner name',p.name);if(n&&n.trim()){p.name=n.trim();save();show()}}
async function ratio(id){const p=S.partners.find(x=>x.id==id),n=await askText('Profit share % for '+p.name,p.ratio,'number');if(n!==null&&n!==''&&!isNaN(+n)){p.ratio=+n;save();show()}}
async function sal(id){const p=S.partners.find(x=>x.id==id),n=await askText('Agreed monthly salary for '+p.name,p.salary||0,'number');if(n!==null&&n!==''&&!isNaN(+n)){p.salary=+n;save();show()}}
async function addP(){const n=await askText('New partner name');if(n&&n.trim()){S.partners.push({id:nid(),name:n.trim(),ratio:0,salary:0});save();show()}}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='books-backup.json';a.click()}
function im(i){const f0=i.files[0];if(!f0)return;const r=new FileReader();r.onload=async()=>{let o;try{o=JSON.parse(r.result);if(!o||!Array.isArray(o.tx)||!Array.isArray(o.partners))throw 0}catch(e){return toast('That file could not be read.')}
 if(!(await askYes('This REPLACES the shared books for every partner with the contents of this backup. Continue?')))return;S=Object.assign(dflt(),o);fixS();posRebuild();S.partners.sort((a,b)=>a.id-b.id);dirty=true;await flush();show()};r.readAsText(f0)}

function reports(){const k=rep.kind,{from,to}=rep,m=model(k),tabs=[['scf','Cash flow'],['is','Income statement'],['bs','Balance sheet'],['inv','Inventory'],['cap','Partners’ capital']];
 const tb=`<div class="scroll"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${m.cols.map((c,j)=>`<th style="text-align:${j?'right':'left'}">${esc(c)}</th>`).join('')}</tr>${m.rows.map(r=>`<tr style="${r[2]=='t'?'font-weight:700;border-top:2px solid var(--ink)':r[2]=='h'?'font-weight:700;font-style:italic':''}"><td>${esc(r[0])}</td>${m.cols.slice(1).map((_,j)=>`<td class="num">${r[1][j]??''}</td>`).join('')}</tr>`).join('')}</table></div>`;
 return `<h1>Reports</h1><div class="seg noprint">${tabs.map(t=>`<button class="${k==t[0]?'on':''}" onclick="rep.kind='${t[0]}';show()">${t[1]}</button>`).join('')}</div>
 <div class="grid noprint"><div><label>From</label><input type="date" value="${from}" onchange="rep.from=this.value;show()"></div><div><label>To</label><input type="date" value="${to}" onchange="rep.to=this.value;show()"></div></div>
 <div class="card" style="margin-top:12px"><h3 style="margin:0">${m.name}</h3><div class="mut">${m.period}</div>${tb}${m.note?`<p class="mut">${esc(m.note)}</p>`:''}${m.warn?'<div class="warn">Assets and equity do not match. Check that profit shares total 100%.</div>':''}${rep.charts?m.charts.map(c=>`<img alt="" style="width:100%;margin-top:10px" src="${chart(...c).url}">`).join(''):(m.charts.length?'<button class="noprint" style="margin-top:10px" onclick="rep.charts=true;show()">Show charts</button>':'')}</div>
 <div class="card noprint"><h2 style="margin-top:0">Export documents</h2><div class="mut">Tick the reports to put in one document.</div>
 ${tabs.map(t=>`<label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" style="width:20px" ${rep.sel[t[0]]?'checked':''} onchange="rep.sel['${t[0]}']=this.checked"> ${t[1]}</label>`).join('')}
 <div class="seg" style="margin-top:12px"><button onclick="exportReports('docx')">Word (.docx)</button><button onclick="exportReports('pdf')">PDF</button></div><div id="exmsg" class="mut"></div></div>
 <h2>Saved PDF reports</h2><div id="saved"><button onclick="rep.saved=true;refreshSaved()">Show saved PDFs</button></div>`}

const NM={scf:'Statement of Cash Flows',is:'Income Statement',bs:'Balance Sheet',cap:'Statement of Partners’ Capital',cf:'Cash by Account',inv:'Inventory Report',rp:'Receivables and Payables',ln:'Loans and Repayment Schedule'};

const prevDay=d=>new Date(new Date(d)-864e5).toISOString().slice(0,10);
const PAL=['#8a6d1d','#1f5c46','#333333','#b08d2a','#5a7d6b','#a63a2b'];
function model(k){const {from,to}=rep,P=S.partners,A=S.accounts,R=[],C=[];let cols=['',''],W=false;
 const sm=(fn)=>sum(S.tx.filter(fn).map(t=>+t.amt));
 if(k=='is'){const p=profit(from,to);R.push(['Sales / income',[],'h']);Object.entries(p.inc).forEach(([a,b])=>R.push([a,[f(b)]]));R.push(['Total sales',[f(p.ti)],'t'],['Less: Sales returns (returns inwards)',[f(p.sr)]],['Net sales',[f(p.ti-p.sr)],'t'],['Cost of goods sold',[],'h'],['Beginning inventory',[f(p.beg)]],['Add: Purchases',[f(p.pur)]],['Less: Purchases returns (returns outwards)',[f(p.pr)]],['Net purchases',[f(p.pur-p.pr)]]);if(p.intro)R.push(['Add: Stock introduced by partners',[f(p.intro)]]);
  R.push(['Goods available for sale',[f(p.beg+p.pur-p.pr+p.intro)]],['Less: Ending inventory',[f(p.end)]],['Cost of goods sold',[f(p.cogs)],'t'],...(p.ls?[['Memo: stock lost or damaged (included above)',[f(p.ls)]]]:[]),['Gross profit',[f(p.gp)],'t'],['Operating expenses',[],'h']);Object.entries(p.exp).forEach(([a,b])=>R.push([a,[f(b)]]));
  R.push(['Total expenses',[f(p.te)],'t'],['Total cost of sales and expenses (purchases included)',[f(p.cogs+p.te)]]);if(p.lt){R.push(['Losses written off',[],'h']);Object.entries(p.lossO).forEach(([k,v])=>R.push([LOSSL[k],[f(v)]]));R.push(['Total losses',[f(p.lt)],'t'])}R.push(['Net profit',[f(p.np)],'t'],['Share of profit',[],'h']);
  P.forEach(x=>{const s=salE(x,p);if(s)R.push([x.name+' – agreed salary',[f(s)]]);R.push([x.name+' – profit share ('+x.ratio+'%)',[f(share(x,p)-s)]])});
  C.push(['bar','Sales, cost of goods and profit',['Net sales','Cost of goods','Gross profit','Expenses','Losses','Net profit'],[p.ti-p.sr,p.cogs,p.gp,p.te,p.lt,p.np]]);
  if(p.te>0)C.push(['pie','Operating expenses by category',Object.keys(p.exp),Object.values(p.exp)]);
  C.push(['bar','Salary and profit share by partner',P.map(x=>x.name),P.map(x=>share(x,p))])}
 if(k=='bs'){const all=profit('',to),as=A.map(a=>bal(a,to)),ar=sum(dues('r',to).map(x=>x[1])),ap=sum(dues('p',to).map(x=>x[1])),lo=sum(S.loans.map(l=>loanBal(l.id,to))),inv=invVal(to),sd=shopDue(to),ta=sum(as)+ar+inv+sd;
  R.push(['Assets',[],'h']);A.forEach((a,i)=>R.push([a,[f(as[i])]]));R.push(['Accounts receivable',[f(ar)]],['Inventory',[f(inv)]],['Due from shopkeepers (takings not yet paid in)',[f(sd)]],['Total assets',[f(ta)],'t'],['Liabilities',[],'h'],['Accounts payable',[f(ap)]],['Loans payable',[f(lo)]],['Total liabilities',[f(ap+lo)],'t'],['Partners’ equity',[],'h']);
  const eq=P.map(x=>sm(t=>isCap(t)&&t.partner==x.id&&t.date<=to)+share(x,all)-sm(t=>(t.type=='drawing'||t.type=='salary')&&t.partner==x.id&&t.date<=to));
  P.forEach((x,i)=>R.push([x.name,[f(eq[i])]]));R.push(['Total equity',[f(sum(eq))],'t'],['Total liabilities and equity',[f(ap+lo+sum(eq))],'t']);W=Math.abs(ta-ap-lo-sum(eq))>.005;

const dflt=()=>({accounts:['Bank','Cash','Mobile Money'],acctTypes:{},partners:[{id:1,name:'Partner 1',ratio:34,salary:0},{id:2,name:'Partner 2',ratio:33,salary:0},{id:3,name:'Partner 3',ratio:33,salary:0}],tx:[],loans:[],cust:{},apps:[],pos:[],remit:[],prods:[],pcust:[],stk:{items:{}},preq:[],pvote:[],exp:[],grn:[],msg:[],dir:[],plog:[],ord:[],rel:[],scount:[],sloss:[],seq:10,appN:0,appRule:{need:0,min:0,file:1,allow:0},sav:{target:0,year:new Date().getFullYear(),account:'',salesPct:0,profitPct:0,pledges:{}}});
function fixS(){if(!Array.isArray(S.savs))S.savs=(S.sav&&S.sav.target>0&&S.sav.account)?[Object.assign({id:1,name:'Emergency savings'},S.sav)]:[];S.plog=S.plog||[];S.ord=S.ord||[];S.rel=S.rel||[];S.msg=S.msg||[];S.dir=S.dir||[];S.exp=S.exp||[];S.grn=S.grn||[];S.preq=S.preq||[];S.pvote=S.pvote||[];S.scount=S.scount||[];S.sloss=S.sloss||[];S.stk=S.stk||{items:{}};S.pos=S.pos||[];S.remit=S.remit||[];S.prods=S.prods||[];S.pcust=S.pcust||[];S.loans=S.loans||[];S.cust=S.cust||{};S.acctTypes=S.acctTypes||{};S.apps=S.apps||[];S.tx=S.tx||[];S.partners=S.partners||[];S.accounts=S.accounts&&S.accounts.length?S.accounts:['Bank','Cash','Mobile Money'];S.appN=S.appN||0;S.appRule=Object.assign({need:0,min:0,file:1,allow:0},S.appRule||{});S.sav=Object.assign({target:0,year:new Date().getFullYear(),account:'',salesPct:0,profitPct:0,pledges:{}},S.sav||{});apMig()}
function setStatus(t){stat=t;const e=$('#sst');if(e)e.textContent=t}
function hdr(){$('#hd').innerHTML=`<img alt="" src="${LOGO}"><div><b>D&amp;K Liquor &amp; Whiskey</b><span>${EMPL?ROLEL[ROLE]:'Partners’ Books'}${RO?' · View only':''}</span></div><div style="margin-left:auto;text-align:right;font-size:11px;opacity:.85"><span id="sst">${esc(stat)}</span></div>`}
function toRows(){const m={},put=(k,id,d)=>{m[k+SEP+id]={kind:k,id:String(id),data:strip(d)}};
 if(!EMPL){const it={};invItems().forEach(o=>{it[o.name]={q:Math.round(o.base*1000)/1000,cut:o.cut}});put('stk','main',{items:it,g:S.grn.map(x=>x.id)})}
 put('meta','main',{accounts:S.accounts,acctTypes:S.acctTypes,appRule:S.appRule,appN:S.appN,sav:S.sav,savs:S.savs});
 S.partners.forEach(p=>put('partner',p.id,p));S.tx.filter(t=>!t._pos).forEach(t=>put('tx',t.id,t));S.pos.forEach(x=>put('pos',x.id,x));S.remit.forEach(x=>put('remit',x.id,x));S.prods.forEach(x=>put('prod',x.id,x));S.pcust.forEach(x=>put('pcust',x.id,x));S.preq.forEach(x=>put('preq',x.id,x));S.pvote.forEach(x=>put('pvote',x.id,x));S.scount.forEach(x=>put('scount',x.id,x));S.sloss.forEach(x=>put('sloss',x.id,x));S.exp.forEach(x=>put('exp',x.id,x));S.plog.forEach(x=>put('plog',x.id,x));S.ord.forEach(x=>put('ord',x.id,x));S.rel.forEach(x=>put('rel',x.id,x));S.msg.forEach(x=>put('msg',x.id,x));S.dir.forEach(x=>put('dir',x.id,x));S.grn.forEach(x=>put('grn',x.id,x));S.loans.forEach(l=>put('loan',l.id,l));Object.keys(S.cust).forEach(n=>put('cust',n,S.cust[n]));S.apps.forEach(a=>put('app',a.id,a));if(EMPL){const ks=EMPK[ROLE]||[];for(const k in m)if(!ks.includes(m[k].kind))delete m[k]}return m}
function applyRow(r,del){const id=String(r.id),k=r.kind+SEP+id,L={tx:'tx',partner:'partners',loan:'loans',app:'apps',pos:'pos',remit:'remit',prod:'prods',pcust:'pcust',preq:'preq',pvote:'pvote',scount:'scount',sloss:'sloss',exp:'exp',grn:'grn',msg:'msg',dir:'dir',ord:'ord',rel:'rel',plog:'plog'};
 if(r.kind=='meta'){if(del)return;Object.assign(S,r.data)}
 else if(r.kind=='stk'){S.stk=del?{items:{}}:r.data}
 else if(r.kind=='cust'){if(del)delete S.cust[id];else S.cust[id]=r.data}
 else if(L[r.kind]){const arr=S[L[r.kind]],i=arr.findIndex(x=>String(x.id)==id);if(del){if(i>=0)arr.splice(i,1)}else{if((r.kind=='tx'||r.kind=='app')&&r.updated_by)r.data._by=r.updated_by;if(i>=0)arr[i]=r.data;else arr.push(r.data)}}
 if(del)delete BASE[k];else BASE[k]=canon(strip(r.data))}
async function loadAll(){let rows=[],from=0;for(;;){const {data,error}=await sb.from('records').select('*').range(from,from+999);if(error)throw error;rows=rows.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return rows}
async function flush(){if(RO||!SYNC||!sb)return;if(flushing){again=true;return}flushing=true;
 try{do{again=false;const cur=toRows(),up=[],del={};
  for(const k in cur){const c=canon(cur[k].data);if(BASE[k]!==c)up.push([k,cur[k],c])}
  for(const k in BASE){if(!EMPL&&!cur[k]){const p=k.split(SEP);(del[p[0]]=del[p[0]]||[]).push(p[1])}}
  for(let i=0;i<up.length;i+=100){const ch=up.slice(i,i+100),{error}=await sb.from('records').upsert(ch.map(x=>x[1]),{onConflict:'kind,id',ignoreDuplicates:EMPL});if(error)throw error;ch.forEach(x=>BASE[x[0]]=x[2])}
  for(const kind in del){const {error}=await sb.from('records').delete().eq('kind',kind).in('id',del[kind]);if(error)throw error;del[kind].forEach(id=>delete BASE[kind+SEP+id])}
 }while(again);dirty=false;setStatus('Saved')}
 catch(e){setStatus('Not saved, retrying…');clearTimeout(ftmr);ftmr=setTimeout(flush,6000)}
 flushing=false}
function save(){if(RO||!SYNC)return;dirty=true;setStatus('Saving…');clearTimeout(ftmr);ftmr=setTimeout(flush,300)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function schedRender(){clearTimeout(rtmr);rtmr=setTimeout(()=>{const a=document.activeElement;if(tab=='add'||(a&&a.id!='cm_t'&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))||document.querySelector('.ov')){pendRender=true;return}const kp=a&&a.id=='cm_t';show();if(kp){const t=$('#cm_t');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);chatType(t);window.scrollTo(0,document.body.scrollHeight)}}},350)}
document.addEventListener('focusout',()=>{if(pendRender)setTimeout(()=>{const a=document.activeElement;if(tab!='add'&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&!document.querySelector('.ov')){pendRender=false;show()}},400)});
function onRT(p){if(RO){reloadRO();return}try{const del=p.eventType=='DELETE',r=del?p.old:p.new;if(!r||!r.kind)return;
 if(!del){const k=r.kind+SEP+r.id,c=toRows()[k];if(c&&canon(c.data)==canon(strip(r.data)))return}
 applyRow(r,del);S.partners.sort((a,b)=>a.id-b.id);fixS();if(!EMPL)posRebuild();schedRender()}catch(e){}}
async function resync(){if(!SYNC||flushing||dirty)return;if(RO){reloadRO();return}try{const rows=await loadAll(),seen=new Set();let ch=false;
 rows.forEach(r=>{const k=r.kind+SEP+r.id;seen.add(k);if(BASE[k]!==canon(strip(r.data))){applyRow(r);ch=true}});
 Object.keys(BASE).forEach(k=>{if(!seen.has(k)){const p=k.split(SEP);applyRow({kind:p[0],id:p[1]},true);ch=true}});
 if(ch){S.partners.sort((a,b)=>a.id-b.id);fixS();if(!EMPL)posRebuild();schedRender()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')resync()});
function subscribe(){try{sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},onRT).subscribe(s=>{if(s=='SUBSCRIBED')setStatus(dirty?'Saving…':'Live')})}catch(e){}}
/* view-only: three layers (hidden controls, frozen data, blocked clicks); the database refuses writes as well */
const OKRE=/^(svSel=|chatOpen\(|relFunds\(|mmark\(|prFilter=|lossDoc\(|rcptShow\(|tab=|openLoan=|apFilter=|rep\.|togSup\(|togCust\(|apView\(|svView\(|svDl\(|exportReports\(|refreshSaved\(|ex\(|chgPw\(|signOut\()/;
function deepFreeze(o,k){if(k==='msg')return o;if(o&&typeof o=='object'&&!Object.isFrozen(o)){Object.freeze(o);Object.entries(o).forEach(([kk,v])=>deepFreeze(v,kk))}return o}
const ACCT_TABS=['add','ledger','debts','stock','approvals','reports','savings','chat'];
const acctOK=oc=>ROLE=='acct'&&tab=='shop'&&/^(markRecv\(|remUndo\()/.test(String(oc).trim());
const roLock=()=>tab!='chat'&&(RO||(ROLE=='acct'&&!ACCT_TABS.includes(tab)));
function lockRO(){if(!roLock())return;try{document.querySelectorAll('#app button').forEach(b=>{const oc=b.getAttribute('onclick');if(oc&&!OKRE.test(oc.trim())&&!acctOK(oc))b.style.display='none'});
 document.querySelectorAll('#app input,#app select,#app textarea').forEach(x=>{if(!/^rep\./.test((x.getAttribute('onchange')||'').trim()))x.disabled=true})}catch(e){}}
let rotmr=null;
function reloadRO(){clearTimeout(rotmr);rotmr=setTimeout(async()=>{try{const rows=await loadAll();S=dflt();S.partners=[];BASE={};rows.forEach(r=>applyRow(r));S.partners.sort((a,b)=>a.id-b.id);fixS();posRebuild();deepFreeze(S);schedRender()}catch(e){}},600)}
/* view-only guard */
document.addEventListener('click',e=>{if(!roLock())return;const b=e.target.closest&&e.target.closest('button');if(!b||b.dataset.t)return;const oc=b.getAttribute('onclick');if(!oc)return;
 if(OKRE.test(oc.trim())||acctOK(oc))return;
 e.stopPropagation();e.preventDefault();toast(ROLE=='acct'?'You can view this page. Accountants edit only the accounting pages.':'View-only access: you can look and print reports, but not change anything.')},true);
/* sign-in */
const loadingCard=t=>`<div class="card"><p class="mut" style="margin:0">${esc(t)}</p></div>`;
function showLogin(){$('#nv').style.display='none';$('#app').innerHTML=`<h1>Sign in</h1><div class="card"><div class="mut">Partners only. Use the email and password you were given.</div><label>Email</label><input id="lg_e" type="email" autocomplete="username" autocapitalize="none"><label>Password</label><input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><button class="p" id="lg_b" onclick="doLogin()">Sign in</button></div>`}
async function doLogin(){const e=$('#lg_e').value.trim(),p=$('#lg_p').value;if(!e||!p)return toast('Enter your email and password.');const b=$('#lg_b');if(b)b.disabled=true;
 try{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){if(b)b.disabled=false;return toast(/invalid/i.test(error.message)?'Wrong email or password.':'Sign-in failed: '+error.message)}await startSession(data.session)}catch(x){if(b)b.disabled=false;toast('Sign-in failed. Check your internet connection.')}}
async function signOut(){try{await sb.auth.signOut()}catch(e){}location.reload()}
async function chgPw(){const v=await askForm('Change password',[{k:'a',l:'New password (at least 10 characters)',type:'password',v:''},{k:'b',l:'Type it again',type:'password',v:''}]);if(!v)return;if(v.a.length<10)return toast('Use at least 10 characters.');if(v.a!=v.b)return toast('The two passwords do not match.');
 const {error}=await sb.auth.updateUser({password:v.a});toast(error?'Could not change the password: '+error.message:'Password changed.')}
function bootFail(m){$('#nv').style.display='none';$('#app').innerHTML=`<div class="card"><h3>Cannot open the books</h3><p class="mut">${esc(m)}</p><button class="p" onclick="location.reload()">Try again</button></div>`}
function noAccess(){$('#nv').style.display='none';$('#app').innerHTML=`<div class="card"><h3>No access</h3><p class="mut">${esc(ME)} is signed in but has not been set up as a partner. Ask a full partner to add you.</p><button class="p" onclick="signOut()">Sign out</button></div>`}
async function startSession(session){ME=(session.user.email||'').toLowerCase();$('#app').innerHTML=loadingCard('Opening the books…');
 try{const {data:rl,error:e1}=await sb.from('partner_roles').select('role,admin,name').eq('email',ME).maybeSingle();if(e1)throw e1;if(!rl)return noAccess();ROLE=rl.role;ADMIN=!!rl.admin;RO=ROLE=='view';SHOP=ROLE=='shop';STOCKM=ROLE=='stock';PROCM=ROLE=='proc';EMPL=!!EMPK[ROLE];hdr();
  const rows=await loadAll();S=dflt();S.partners=[];BASE={};rows.forEach(r=>applyRow(r));S.partners.sort((a,b)=>a.id-b.id);fixS();
  if(EMPL){SYNC=true;setStatus('Live');subscribe();buildNav();tab=EMPTAB[ROLE];show();return}
  try{await loadRoster()}catch(e){}
  posRebuild();if(RO)deepFreeze(S);
  if(!rows.some(r=>r.kind=='meta')){
   if(RO){$('#app').innerHTML=loadingCard('The books have not been set up yet. Ask a full partner to sign in first.');return}
   const L=LOCAL,n=L&&L.tx?L.tx.length:0;let use=false;
   if(L&&(n||(L.partners||[]).some(p=>!/^Partner \d$/.test(p.name))))use=await askYes('Found books saved on this device ('+n+' entries). Upload them to the shared database? Choose Yes only if these are your real books.');
   S=use?Object.assign(dflt(),L):dflt();fixS();posRebuild();S.partners.sort((a,b)=>a.id-b.id);SYNC=true;dirty=true;await flush();
  }
  SYNC=true;setStatus('Saved');subscribe();buildNav();tab='home';show()}
 catch(e){bootFail('Could not load the books: '+((e&&e.message)||e))}}
async function boot(){$('#app').innerHTML=loadingCard('Loading…');hdr();
 try{await lib(SB_LIB);sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){return bootFail('Could not load the sign-in service. Check your internet connection.')}
 sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&SYNC)location.reload()});
 try{const {data}=await sb.auth.getSession();if(!data||!data.session)return showLogin();await startSession(data.session)}catch(e){showLogin()}}
/* files: approval proofs and saved PDFs live in Supabase Storage */
async function apFile(a){if(!a.fileId)return null;try{const {data,error}=await sb.storage.from('proofs').download(a.fileId);if(error)throw error;return{name:a.fileName||a.no,mime:data.type||'',blob:data}}catch(e){return null}}
async function apDel(id){if(await askYes('Remove this approval proof?')){const a=S.apps.find(x=>x.id==id);if(a.fileId){try{await sb.storage.from('proofs').remove([a.fileId])}catch(e){}}S.apps=S.apps.filter(x=>x.id!=id);save();show()}}
async function savePdf(o){try{const id=String(nid()),B=sb.storage.from('reports'),up=async(n,b,t)=>{const {error}=await B.upload(id+n,b,{contentType:t});if(error)throw error};
 const meta={id,name:o.fn,title:o.title,per:o.per,created:new Date().toISOString(),size:o.blob.size,kinds:o.ms.map(x=>x.name),by:ME},snap={ms:o.ms.map(x=>({name:x.name,period:x.period,cols:x.cols,rows:x.rows,note:x.note||'',imgs:x.imgs.map(i=>i.url)}))};
 await up('.pdf',o.blob,'application/pdf');await up('.snap.json',new Blob([JSON.stringify(snap)],{type:'application/json'}),'application/json');await up('.meta.json',new Blob([JSON.stringify(meta)],{type:'application/json'}),'application/json');return true}catch(e){return false}}
async function refreshSaved(){const el=$('#saved');if(!el)return;el.innerHTML='<p class="mut">Loading…</p>';
 try{const B=sb.storage.from('reports'),{data,error}=await B.list('',{limit:300,sortBy:{column:'name',order:'desc'}});if(error)throw error;
  const names=(data||[]).map(x=>x.name).filter(n=>n.endsWith('.meta.json')).sort().reverse().slice(0,30);
  const L=(await Promise.all(names.map(async n=>{try{const {data:b}=await B.download(n);return JSON.parse(await b.text())}catch(e){return null}}))).filter(Boolean);
  el.innerHTML=L.length?L.map(r=>`<div class="card"><b>${esc(r.title)}</b><div class="mut">${esc(r.per)}</div><div class="mut">Saved ${new Date(r.created).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} by ${esc(String(r.by||'').split('@')[0])} · ${Math.max(1,Math.round(r.size/1024))} KB</div><div class="mut">${esc(r.kinds.join(', '))}</div><div class="seg" style="margin-top:8px"><button onclick="svView('${r.id}')">Preview</button><button onclick="svDl('${r.id}')">Download</button></div></div>`).join('')+'<p class="mut">Saved copies are shared with all partners and keep the figures exactly as they were when the PDF was created. They cannot be deleted.</p>':'<p class="mut">No saved PDFs yet. Every PDF printed by any partner is kept here.</p>'}
 catch(e){el.textContent='Saved reports could not be loaded.'}}
async function stoGet(id,n){const {data,error}=await sb.storage.from('reports').download(id+n);if(error)throw error;return data}
async function svView(id){try{const meta=JSON.parse(await (await stoGet(id,'.meta.json')).text()),snap=JSON.parse(await (await stoGet(id,'.snap.json')).text()),lg=await logoPng(),one=snap.ms.length==1,d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="mod" style="max-width:640px;background:#fff;color:#000;font-family:'Times New Roman',Times,serif"><div style="text-align:center"><img alt="" src="${lg}" width="96" height="96"><div style="font-size:22px;font-weight:700;font-style:italic;margin-top:6px">${esc(meta.title)}</div><div style="font-size:11px;font-weight:700;font-style:italic;margin-bottom:14px">${esc(meta.per)}</div></div>${snap.ms.map(x=>`${one?'':`<div style="font-weight:700;font-size:16px;margin-top:18px">${esc(x.name)}</div><div style="font-style:italic;font-size:12px">${esc(x.period)}</div>`}${ptbl(x)}${x.imgs.map(u=>`<img alt="" style="width:100%;margin-top:10px" src="${u}">`).join('')}`).join('')}<div class="seg" style="margin-top:16px"><button id="pc">Close</button><button class="on" id="pd">Download PDF</button></div></div>`;
 document.body.appendChild(d);d.querySelector('#pc').onclick=()=>d.remove();d.querySelector('#pd').onclick=()=>svDl(id)}catch(e){toast('That report could not be opened.')}}
async function svDl(id){try{const meta=JSON.parse(await (await stoGet(id,'.meta.json')).text()),blob=await stoGet(id,'.pdf'),dl=await claude.use('downloads');await dl.save({filename:meta.name||id+'.pdf',data:blob})}catch(e){if(!(e&&e.code=='declined'))toast('Download failed.')}}
boot();
</script></body></html>
