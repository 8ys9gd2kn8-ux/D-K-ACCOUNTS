<script>
const TYPES={income:'Sale / income',expense:'Expense / purchase',capital:'Capital in',drawing:'Drawing',invoice:'Credit sale (invoice)',retin:'Sales return (goods back from a customer)',retout:'Purchase return (goods back to a supplier)',stock:'Purchase of goods',stockc:'Purchase of goods (credit)',count:'Stock count',stockcap:'Opening stock (partner capital)',bill:'Credit purchase (bill)',rcpt:'Payment from customer',pay:'Payment to supplier',loanpay:'Loan repayment',loanin:'Loan received',salary:'Salary paid',transfer:'Transfer'};
const IN=['income','capital','rcpt','loanin','retout'],OUT=['expense','drawing','salary','pay','loanpay','stock','retin'],RK=['is','bs','inv','cap','cf'],MT={emi:'Equal instalments',equal:'Equal principal',flat:'Flat interest',bullet:'Interest monthly, principal at the end'};
const CATS={income:['Sales','Service fees','Other income'],expense:['Rent','Salaries','Transport','Utilities','Supplies','Bank & mobile charges','Other expense']};
let LOCAL=null;let S={accounts:['Bank','Cash','Mobile Money'],partners:[{id:1,name:'Partner 1',ratio:34},{id:2,name:'Partner 2',ratio:33},{id:3,name:'Partner 3',ratio:33}],tx:[],seq:10,loans:[],cust:{},apps:[],appN:0,appRule:{need:0,min:0}};
try{const r=localStorage.getItem('pb1');if(r)LOCAL=JSON.parse(r)}catch(e){}
S.loans=S.loans||[];S.cust=S.cust||{};S.acctTypes=S.acctTypes||{};S.apps=S.apps||[];S.appN=S.appN||0;S.appRule=Object.assign({need:0,min:0,file:1,allow:0},S.appRule||{});apMig();

let tab='home',entryForm={type:'income'},rep={sel:{is:true},from:'',to:new Date().toISOString().slice(0,10),kind:'is'};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(n<0?'(':'')+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+(n<0?')':'');
const pn=id=>(S.partners.find(p=>p.id==id)||{name:'?'}).name;
const sum=a=>a.reduce((x,y)=>x+y,0);
const ca=t=>+t.amt+(t.type=='loanpay'?+t.int||0:0);
function bal(acct,to){let b=0;S.tx.filter(t=>!to||t.date<=to).forEach(t=>{const a=ca(t);if(t.type=='transfer'){if(t.acct==acct)b-=a;if(t.to==acct)b+=a}else if(t.acct==acct&&t.type!='invoice'&&t.type!='bill')b+=IN.includes(t.type)?a:-a});return b}
function dues(k,to){const A=k=='r'?['invoice']:['bill','stockc'],B=k=='r'?['rcpt']:['pay'],m={};S.tx.forEach(t=>{if(to&&t.date>to)return;if(A.includes(t.type))m[t.party]=(m[t.party]||0)+ +t.amt;if(B.includes(t.type))m[t.party]=(m[t.party]||0)-+t.amt;if(t.credit&&((k=='r'&&t.type=='retin')||(k=='p'&&t.type=='retout')))m[t.party]=(m[t.party]||0)-+t.amt});return Object.entries(m).filter(([,v])=>Math.abs(v)>.004)}
const isCap=t=>t.type=='capital'||t.type=='stockcap';
function invItems(to){const m={};S.tx.forEach(t=>{if(!t.item||(to&&t.date>to))return;const o=m[t.item]=m[t.item]||{name:t.item,q:0,c:0,cq:null,cd:'',after:[],rin:[]};if(t.type=='stock'||t.type=='stockc'||t.type=='stockcap'){o.q+=+t.qty;o.c+=+t.amt;o.after.push([t.date,+t.qty])}else if(t.type=='retout'){o.q-=+t.qty;o.c-=+t.amt;o.after.push([t.date,-(+t.qty)])}else if(t.type=='retin'){o.rin.push([t.date,+t.qty])}else if(t.type=='count'&&(!o.cd||t.date>=o.cd)){o.cq=+t.qty;o.cd=t.date}});
 return Object.values(m).map(o=>{o.avg=o.q?o.c/o.q:0;o.onhand=o.cq==null?o.q+sum(o.rin.map(a=>a[1])):o.cq+sum(o.after.filter(a=>a[0]>o.cd).map(a=>a[1]))+sum(o.rin.filter(a=>a[0]>o.cd).map(a=>a[1]));o.val=o.onhand*o.avg;return o}).sort((a,b)=>a.name.localeCompare(b.name))}
const invVal=to=>sum(invItems(to).map(x=>x.val));
function note(to){const u=invItems(to).filter(x=>x.cq==null).map(x=>x.name);return u.length?'No stock count yet for: '+u.join(', ')+'. These items are valued as if all purchased stock is still on hand.':''}
const loanBal=(id,to)=>sum(S.tx.filter(t=>t.loan==id&&(!to||t.date<=to)).map(t=>t.type=='loanin'?+t.amt:t.type=='loanpay'?-t.amt:0));
const loanName=id=>(S.loans.find(l=>l.id==id)||{name:'Loan'}).name;
const addM=(d,k)=>{const [y,m,dd]=d.split('-').map(Number),t=new Date(Date.UTC(y,m-1+k,1)),last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(dd,last));return t.toISOString().slice(0,10)};
function sched(L){const n=+L.term,r=(L.ratePer=='month'?L.rate/100:L.rate/1200),P=+L.amt,emi=r?P*r/(1-Math.pow(1+r,-n)):P/n;let b=P;const o=[];for(let k=1;k<=n;k++){let i,p;if(L.method=='flat'){i=P*r;p=P/n}else if(L.method=='bullet'){i=b*r;p=0}else if(L.method=='equal'){p=P/n;i=b*r}else{i=b*r;p=emi-i}if(k==n)p=b;b-=p;o.push({k,due:addM(L.start,k),pay:p+i,p,i,bal:Math.max(b,0)})}return o}
const isPaid=(l,k)=>S.tx.some(t=>t.type=='loanpay'&&t.loan==l.id&&t.inst==k);
const inR=(t,from,to)=>(!from||t.date>=from)&&(!to||t.date<=to);
function profit(from,to){const L=S.tx.filter(t=>inR(t,from,to)),inc={},exp={};
 L.forEach(t=>{if(t.type=='income'||t.type=='invoice')inc[t.cat]=(inc[t.cat]||0)+ +t.amt;if(t.type=='expense'||t.type=='bill')exp[t.cat]=(exp[t.cat]||0)+ +t.amt;if(t.type=='loanpay'&&+t.int)exp['Loan interest']=(exp['Loan interest']||0)+ +t.int});
 const ti=sum(Object.values(inc)),te=sum(Object.values(exp)),beg=from?invVal(prevDay(from)):0,pur=sum(L.filter(t=>t.type=='stock'||t.type=='stockc').map(t=>+t.amt)),intro=sum(L.filter(t=>t.type=='stockcap').map(t=>+t.amt)),end=invVal(to),sr=sum(L.filter(t=>t.type=='retin').map(t=>+t.amt)),pr=sum(L.filter(t=>t.type=='retout').map(t=>+t.amt)),cogs=beg+pur-pr+intro-end,gp=ti-sr-cogs;
 return{inc,exp,ti,te,beg,pur,intro,end,sr,pr,cogs,gp,np:gp-te,f:from,t:to}}
const mo=(a,b)=>{const d=S.tx.map(x=>x.date).sort();a=a||d[0];b=b||new Date().toISOString().slice(0,10);return(!a||b<a)?0:(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7))+1};
const salE=(x,P)=>(+x.salary||0)*mo(P.f,P.t);
const share=(x,P)=>salE(x,P)+(P.np-sum(S.partners.map(y=>salE(y,P))))*x.ratio/100;
const idb=()=>new Promise((ok,no)=>{try{const q=indexedDB.open('pbooks-saved',1);q.onupgradeneeded=()=>q.result.createObjectStore('pdfs',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}});
const sdb=async(mode,fn)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('pdfs',mode),r=fn(t.objectStore('pdfs'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
async function savePdf(o){try{await sdb('readwrite',s=>s.put({id:Date.now(),name:o.fn,title:o.title,per:o.per,created:new Date().toISOString(),size:o.blob.size,kinds:o.ms.map(x=>x.name),blob:o.blob,ms:o.ms.map(x=>({name:x.name,period:x.period,cols:x.cols,rows:x.rows,note:x.note||'',imgs:x.imgs.map(i=>i.url)}))}));return true}catch(e){return false}}
async function refreshSaved(){const el=$('#saved');if(!el)return;try{const L=(await sdb('readonly',s=>s.getAll())||[]).filter(r=>!r.proof).sort((a,b)=>b.id-a.id);
 el.innerHTML=L.length?L.map(r=>`<div class="card"><b>${esc(r.title)}</b><div class="mut">${esc(r.per)}</div><div class="mut">Saved ${new Date(r.created).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} · ${Math.max(1,Math.round(r.size/1024))} KB</div><div class="mut">${esc(r.kinds.join(', '))}</div><div class="seg" style="margin-top:8px"><button onclick="svView(${r.id})">Preview</button><button onclick="svDl(${r.id})">Download</button><button onclick="svDel(${r.id})">Delete</button></div></div>`).join('')+'<p class="mut">Saved copies keep the figures exactly as they were when the PDF was created.</p>':'<p class="mut">No saved PDFs yet. Every PDF you create is kept here for reference.</p>'}catch(e){el.textContent='Saved reports are not available in this browser.'}}
const ptbl=m=>`<div class="scroll"><table style="font-size:12px;color:#000"><tr>${m.cols.map((c,j)=>`<th style="text-align:${j?'right':'left'};color:#000">${esc(c)}</th>`).join('')}</tr>${m.rows.map(r=>`<tr style="${r[2]=='t'?'font-weight:700;border-top:2px solid #000':r[2]=='h'?'font-weight:700;font-style:italic':''}"><td>${esc(r[0])}</td>${m.cols.slice(1).map((_,j)=>`<td class="num">${r[1][j]??''}</td>`).join('')}</tr>`).join('')}</table></div>`;
async function svView(id){const r=await sdb('readonly',s=>s.get(id));if(!r)return toast('That report could not be found.');const lg=await logoPng(),one=r.ms.length==1,d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="mod" style="max-width:640px;background:#fff;color:#000;font-family:'Times New Roman',Times,serif"><div style="text-align:center"><img alt="" src="${lg}" width="96" height="96"><div style="font-size:22px;font-weight:700;font-style:italic;margin-top:6px">${esc(r.title)}</div><div style="font-size:11px;font-weight:700;font-style:italic;margin-bottom:14px">${esc(r.per)}</div></div>${r.ms.map(x=>`${one?'':`<div style="font-weight:700;font-size:16px;margin-top:18px">${esc(x.name)}</div><div style="font-style:italic;font-size:12px">${esc(x.period)}</div>`}${ptbl(x)}${x.imgs.map(u=>`<img alt="" style="width:100%;margin-top:10px" src="${u}">`).join('')}`).join('')}<div class="seg" style="margin-top:16px"><button id="pc">Close</button><button class="on" id="pd">Download PDF</button></div></div>`;
 document.body.appendChild(d);d.querySelector('#pc').onclick=()=>d.remove();d.querySelector('#pd').onclick=()=>svDl(id)}
async function svDl(id){try{const r=await sdb('readonly',s=>s.get(id)),dl=await claude.use('downloads');if(!r||!dl)return toast('Download is not available.');await dl.save({filename:r.name,data:r.blob})}catch(e){if(!(e&&e.code=='declined'))toast('Download failed.')}}
async function svDel(id){if(await askYes('Delete this saved PDF?')){try{await sdb('readwrite',s=>s.delete(id))}catch(e){}refreshSaved()}}
const acctType=n=>S.acctTypes[n]||(/mobile|mpesa|m-pesa|airtel|momo/i.test(n)?'Mobile Money':/cash/i.test(n)?'Cash':/saving|reserve/i.test(n)?'Savings':'Bank');
async function acctAdd(){const v=await askForm('Add money account',[{k:'type',l:'Account type',opts:[['Bank','Bank account'],['Mobile Money','Mobile money number'],['Cash','Cash'],['Savings','Savings / emergency reserve']]},{k:'name',l:'Name (e.g. Equity Bank 0123, or Mobile Money 0712…)',type:'text',v:''}]);if(!v)return;const n=v.name.trim();if(!n)return toast('Enter a name for the account.');
 if(S.accounts.some(a=>a.toLowerCase()==n.toLowerCase()))return toast('An account with that name already exists.');S.accounts.push(n);S.acctTypes[n]=v.type;save();show();toast('Account added. Move money in with Add → Transfer or Capital in.')}
async function acctRen(i){const o=S.accounts[i],n=((await askText('Rename account',o))||'').trim();if(!n||n==o)return;if(S.accounts.some((a,j)=>j!=i&&a.toLowerCase()==n.toLowerCase()))return toast('An account with that name already exists.');
 S.accounts[i]=n;if(S.acctTypes[o]){S.acctTypes[n]=S.acctTypes[o];delete S.acctTypes[o]}S.tx.forEach(t=>{if(t.acct==o)t.acct=n;if(t.to==o)t.to=n});save();show()}
async function acctDel(i){const a=S.accounts[i];if(S.tx.some(t=>t.acct==a||t.to==a))return toast('This account has entries, so it cannot be removed. You can rename it instead.');if(S.accounts.length<=1)return toast('Keep at least one account.');
 if(await askYes('Remove the account '+a+'?')){S.accounts.splice(i,1);delete S.acctTypes[a];save();show()}}
const TYPEL={stock:'Stock',asset:'Asset',expense:'Expense'};
let apFilter='received',apForm=false;
function apMig(){S.apps.forEach(a=>{if(a.votes){a.ref=a.ref||a.no;a.approvedBy=a.votes.filter(v=>v.vote=='approve').map(v=>({name:v.name,date:v.date}));a.approvalDate=a.decided||a.date;a.status=a.status=='approved'?'verified':a.status=='rejected'?'rejected':'received';a.fileId=null;a.fileName='';delete a.votes}})}
const apNo=id=>(S.apps.find(a=>a.id==id)||{no:'?'}).no;
const apSpent=id=>sum(S.tx.filter(t=>t.appr==id).map(t=>+t.amt));
const apState=a=>{if(a.status!='verified')return a.status;const s=apSpent(a.id);return s>=a.est-.009?'funded':s>0?'partly':'verified'};
const APL={received:['Awaiting verification','a'],verified:['Verified · ready to fund','g'],partly:['Partly funded','t'],funded:['Funded','g'],rejected:['Rejected','r']};
const apOptions=t=>S.apps.filter(a=>a.status=='verified'&&(t=='stock'?a.type=='stock':a.type!='stock')&&a.est-apSpent(a.id)>.009).map(a=>`<option value="${a.id}" ${entryForm.appr==a.id?'selected':''}>${esc(a.no)} · ${esc(a.desc.slice(0,26))} · left ${f(a.est-apSpent(a.id))}</option>`).join('');
const putProof=async file=>{const id='p'+nid(),{error}=await sb.storage.from('proofs').upload(id,file,{contentType:file.type||'application/octet-stream'});if(error)throw error;return id};
function approvals(){const R=S.appRule,mn=+R.min||0,st=a=>apState(a),flt={received:a=>st(a)=='received',ready:a=>st(a)=='verified'||st(a)=='partly',funded:a=>st(a)=='funded',rejected:a=>st(a)=='rejected',all:()=>true},nm={received:'Awaiting',ready:'Ready',funded:'Funded',rejected:'Rejected',all:'All'};

 const res=prs.filter(p=>p.st!='pending'),prom=res.length?res.filter(p=>p.st=='kept').length/res.length:null;

 const g=score==null?{k:'n',label:'No history yet',advice:'Not enough payment history to rate this customer yet. Keep the limit modest.'}:score>=85?{k:'g',label:'Excellent',advice:'Reliable payer. Safe to extend credit.'}:score>=70?{k:'t',label:'Good',advice:'Generally pays well. Credit is reasonable.'}:score>=50?{k:'a',label:'Fair',advice:'Pays late at times. Consider shorter terms or a lower limit.'}:{k:'r',label:'Poor',advice:'High risk. Move to cash sales until the balance is cleared.'};

let sb=null,ME='',RO=false,SYNC=false,BASE={},ftmr=null,rtmr=null,flushing=false,again=false,dirty=false,pendRender=false,stat='';
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x=='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,c)=>(a[c]=x[c],a),{}):x);
const strip=o=>{if(!o||typeof o!='object')return o;const d={...o};delete d._by;return d};
const nid=(()=>{let last=0;return()=>{let v=Date.now()*1000+Math.floor(Math.random()*1000);if(v<=last)v=last+1;last=v;return v}})();
const dflt=()=>({accounts:['Bank','Cash','Mobile Money'],acctTypes:{},partners:[{id:1,name:'Partner 1',ratio:34,salary:0},{id:2,name:'Partner 2',ratio:33,salary:0},{id:3,name:'Partner 3',ratio:33,salary:0}],tx:[],loans:[],cust:{},apps:[],seq:10,appN:0,appRule:{need:0,min:0,file:1,allow:0},sav:{target:0,year:new Date().getFullYear(),account:'',salesPct:0,profitPct:0,pledges:{}}});
function fixS(){S.loans=S.loans||[];S.cust=S.cust||{};S.acctTypes=S.acctTypes||{};S.apps=S.apps||[];S.tx=S.tx||[];S.partners=S.partners||[];S.accounts=S.accounts&&S.accounts.length?S.accounts:['Bank','Cash','Mobile Money'];S.appN=S.appN||0;S.appRule=Object.assign({need:0,min:0,file:1,allow:0},S.appRule||{});S.sav=Object.assign({target:0,year:new Date().getFullYear(),account:'',salesPct:0,profitPct:0,pledges:{}},S.sav||{});apMig()}
function setStatus(t){stat=t;const e=$('#sst');if(e)e.textContent=t}
function hdr(){$('#hd').innerHTML=`<img alt="" src="${LOGO}"><div><b>D&amp;K Liquor &amp; Whiskey</b><span>Partners’ Books${RO?' · View only':''}</span></div><div style="margin-left:auto;text-align:right;font-size:11px;opacity:.85"><span id="sst">${esc(stat)}</span></div>`}
function toRows(){const m={},put=(k,id,d)=>{m[k+SEP+id]={kind:k,id:String(id),data:strip(d)}};
 put('meta','main',{accounts:S.accounts,acctTypes:S.acctTypes,appRule:S.appRule,appN:S.appN,sav:S.sav});
 S.partners.forEach(p=>put('partner',p.id,p));S.tx.forEach(t=>put('tx',t.id,t));S.loans.forEach(l=>put('loan',l.id,l));Object.keys(S.cust).forEach(n=>put('cust',n,S.cust[n]));S.apps.forEach(a=>put('app',a.id,a));return m}
function applyRow(r,del){const id=String(r.id),k=r.kind+SEP+id,L={tx:'tx',partner:'partners',loan:'loans',app:'apps'};
 if(r.kind=='meta'){if(del)return;Object.assign(S,r.data)}
 else if(r.kind=='cust'){if(del)delete S.cust[id];else S.cust[id]=r.data}
 else if(L[r.kind]){const arr=S[L[r.kind]],i=arr.findIndex(x=>String(x.id)==id);if(del){if(i>=0)arr.splice(i,1)}else{if((r.kind=='tx'||r.kind=='app')&&r.updated_by)r.data._by=r.updated_by;if(i>=0)arr[i]=r.data;else arr.push(r.data)}}
 if(del)delete BASE[k];else BASE[k]=canon(strip(r.data))}
async function loadAll(){let rows=[],from=0;for(;;){const {data,error}=await sb.from('records').select('*').range(from,from+999);if(error)throw error;rows=rows.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return rows}
async function flush(){if(RO||!SYNC||!sb)return;if(flushing){again=true;return}flushing=true;
 try{do{again=false;const cur=toRows(),up=[],del={};
  for(const k in cur){const c=canon(cur[k].data);if(BASE[k]!==c)up.push([k,cur[k],c])}
  for(const k in BASE){if(!cur[k]){const p=k.split(SEP);(del[p[0]]=del[p[0]]||[]).push(p[1])}}
  for(let i=0;i<up.length;i+=100){const ch=up.slice(i,i+100),{error}=await sb.from('records').upsert(ch.map(x=>x[1]),{onConflict:'kind,id'});if(error)throw error;ch.forEach(x=>BASE[x[0]]=x[2])}
  for(const kind in del){const {error}=await sb.from('records').delete().eq('kind',kind).in('id',del[kind]);if(error)throw error;del[kind].forEach(id=>delete BASE[kind+SEP+id])}
 }while(again);dirty=false;setStatus('Saved')}
 catch(e){setStatus('Not saved, retrying…');clearTimeout(ftmr);ftmr=setTimeout(flush,6000)}
 flushing=false}
function save(){if(RO||!SYNC)return;dirty=true;setStatus('Saving…');clearTimeout(ftmr);ftmr=setTimeout(flush,300)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function schedRender(){clearTimeout(rtmr);rtmr=setTimeout(()=>{const a=document.activeElement;if(tab=='add'||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))||document.querySelector('.ov')){pendRender=true;return}show()},350)}
document.addEventListener('focusout',()=>{if(pendRender)setTimeout(()=>{const a=document.activeElement;if(tab!='add'&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&!document.querySelector('.ov')){pendRender=false;show()}},400)});
function onRT(p){if(RO){reloadRO();return}try{const del=p.eventType=='DELETE',r=del?p.old:p.new;if(!r||!r.kind)return;
 if(!del){const k=r.kind+SEP+r.id,c=toRows()[k];if(c&&canon(c.data)==canon(strip(r.data)))return}
 applyRow(r,del);S.partners.sort((a,b)=>a.id-b.id);fixS();schedRender()}catch(e){}}
async function resync(){if(!SYNC||flushing||dirty)return;if(RO){reloadRO();return}try{const rows=await loadAll(),seen=new Set();let ch=false;
 rows.forEach(r=>{const k=r.kind+SEP+r.id;seen.add(k);if(BASE[k]!==canon(strip(r.data))){applyRow(r);ch=true}});
 Object.keys(BASE).forEach(k=>{if(!seen.has(k)){const p=k.split(SEP);applyRow({kind:p[0],id:p[1]},true);ch=true}});
 if(ch){S.partners.sort((a,b)=>a.id-b.id);fixS();schedRender()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')resync()});
function subscribe(){try{sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},onRT).subscribe(s=>{if(s=='SUBSCRIBED')setStatus(dirty?'Saving…':'Live')})}catch(e){}}
/* view-only: three layers (hidden controls, frozen data, blocked clicks); the database refuses writes as well */
const OKRE=/^(tab=|openLoan=|apFilter=|rep\.|togSup\(|togCust\(|apView\(|svView\(|svDl\(|exportReports\(|refreshSaved\(|ex\(|chgPw\(|signOut\()/;
function deepFreeze(o){if(o&&typeof o=='object'&&!Object.isFrozen(o)){Object.freeze(o);Object.values(o).forEach(deepFreeze)}return o}
function lockRO(){if(!RO)return;try{document.querySelectorAll('#app button').forEach(b=>{const oc=b.getAttribute('onclick');if(oc&&!OKRE.test(oc.trim()))b.style.display='none'});
 document.querySelectorAll('#app input,#app select,#app textarea').forEach(x=>{if(!/^rep\./.test((x.getAttribute('onchange')||'').trim()))x.disabled=true})}catch(e){}}
let rotmr=null;
function reloadRO(){clearTimeout(rotmr);rotmr=setTimeout(async()=>{try{const rows=await loadAll();S=dflt();S.partners=[];BASE={};rows.forEach(r=>applyRow(r));S.partners.sort((a,b)=>a.id-b.id);fixS();deepFreeze(S);schedRender()}catch(e){}},600)}
/* view-only guard */
document.addEventListener('click',e=>{if(!RO)return;const b=e.target.closest&&e.target.closest('button');if(!b||b.dataset.t)return;const oc=b.getAttribute('onclick');if(!oc)return;
 if(OKRE.test(oc.trim()))return;
 e.stopPropagation();e.preventDefault();toast('View-only access: you can look and print reports, but not change anything.')},true);
/* sign-in */
const loadingCard=t=>`<div class="card"><p class="mut" style="margin:0">${esc(t)}</p></div>`;
function showLogin(){$('#nv').style.display='none';$('#app').innerHTML=`<h1>Sign in</h1><div class="card"><div class="mut">Partners only. Use the email and password you were given.</div><label>Email</label><input id="lg_e" type="email" autocomplete="username" autocapitalize="none"><label>Password</label><input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><button class="p" id="lg_b" onclick="doLogin()">Sign in</button></div>`}
async function doLogin(){const e=$('#lg_e').value.trim(),p=$('#lg_p').value;if(!e||!p)return toast('Enter your email and password.');const b=$('#lg_b');if(b)b.disabled=true;
 try{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){if(b)b.disabled=false;return toast(/invalid/i.test(error.message)?'Wrong email or password.':'Sign-in failed: '+error.message)}await startSession(data.session)}catch(x){if(b)b.disabled=false;toast('Sign-in failed. Check your internet connection.')}}
async function signOut(){try{await sb.auth.signOut()}catch(e){}location.reload()}
async function chgPw(){const v=await askForm('Change password',[{k:'a',l:'New password (at least 10 characters)',type:'password',v:''},{k:'b',l:'Type it again',type:'password',v:''}]);if(!v)return;if(v.a.length<10)return toast('Use at least 10 characters.');if(v.a!=v.b)return toast('The two passwords do not match.');
 const {error}=await sb.auth.updateUser({password:v.a});toast(error?'Could not change the password: '+error.message:'Password changed.')}
function bootFail(m){$('#nv').style.display='none';$('#app').innerHTML=`<div class="card"><h3>Cannot open the books</h3><p class="mut">${esc(m)}</p><button class="p" onclick="location.reload()">Try again</button></div>`}
function noAccess(){$('#nv').style.display='none';$('#app').innerHTML=`<div class="card"><h3>No access</h3><p class="mut">${esc(ME)} is signed in but has not been set up as a partner. Ask a full partner to add you.</p><button class="p" onclick="signOut()">Sign out</button></div>`}
async function startSession(session){ME=(session.user.email||'').toLowerCase();$('#app').innerHTML=loadingCard('Opening the books…');
 try{const {data:rl,error:e1}=await sb.from('partner_roles').select('role').eq('email',ME).maybeSingle();if(e1)throw e1;if(!rl)return noAccess();RO=rl.role=='view';hdr();
  const rows=await loadAll();S=dflt();S.partners=[];BASE={};rows.forEach(r=>applyRow(r));S.partners.sort((a,b)=>a.id-b.id);fixS();if(RO)deepFreeze(S);
  if(!rows.some(r=>r.kind=='meta')){
   if(RO){$('#app').innerHTML=loadingCard('The books have not been set up yet. Ask a full partner to sign in first.');return}
   const L=LOCAL,n=L&&L.tx?L.tx.length:0;let use=false;
   if(L&&(n||(L.partners||[]).some(p=>!/^Partner \d$/.test(p.name))))use=await askYes('Found books saved on this device ('+n+' entries). Upload them to the shared database? Choose Yes only if these are your real books.');
   S=use?Object.assign(dflt(),L):dflt();fixS();S.partners.sort((a,b)=>a.id-b.id);SYNC=true;dirty=true;await flush();
  }
  SYNC=true;setStatus('Saved');subscribe();buildNav();tab='home';show()}
 catch(e){bootFail('Could not load the books: '+((e&&e.message)||e))}}
async function boot(){$('#app').innerHTML=loadingCard('Loading…');hdr();
 try{await lib(SB_LIB);sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){return bootFail('Could not load the sign-in service. Check your internet connection.')}
 sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&SYNC)location.reload()});
 try{const {data}=await sb.auth.getSession();if(!data||!data.session)return showLogin();await startSession(data.session)}catch(e){showLogin()}}
/* files: approval proofs and saved PDFs live in Supabase Storage */
async function apFile(a){if(!a.fileId)return null;try{const {data,error}=await sb.storage.from('proofs').download(a.fileId);if(error)throw error;return{name:a.fileName||a.no,mime:data.type||'',blob:data}}catch(e){return null}}
async function apDel(id){if(await askYes('Remove this approval proof?')){const a=S.apps.find(x=>x.id==id);if(a.fileId){try{await sb.storage.from('proofs').remove([a.fileId])}catch(e){}}S.apps=S.apps.filter(x=>x.id!=id);save();show()}}
async function savePdf(o){try{const id=String(nid()),B=sb.storage.from('reports'),up=async(n,b,t)=>{const {error}=await B.upload(id+n,b,{contentType:t});if(error)throw error};
 const meta={id,name:o.fn,title:o.title,per:o.per,created:new Date().toISOString(),size:o.blob.size,kinds:o.ms.map(x=>x.name),by:ME},snap={ms:o.ms.map(x=>({name:x.name,period:x.period,cols:x.cols,rows:x.rows,note:x.note||'',imgs:x.imgs.map(i=>i.url)}))};
 await up('.pdf',o.blob,'application/pdf');await up('.snap.json',new Blob([JSON.stringify(snap)],{type:'application/json'}),'application/json');await up('.meta.json',new Blob([JSON.stringify(meta)],{type:'application/json'}),'application/json');return true}catch(e){return false}}
async function refreshSaved(){const el=$('#saved');if(!el)return;el.innerHTML='<p class="mut">Loading…</p>';
 try{const B=sb.storage.from('reports'),{data,error}=await B.list('',{limit:300,sortBy:{column:'name',order:'desc'}});if(error)throw error;
  const names=(data||[]).map(x=>x.name).filter(n=>n.endsWith('.meta.json')).sort().reverse().slice(0,30);
  const L=(await Promise.all(names.map(async n=>{try{const {data:b}=await B.download(n);return JSON.parse(await b.text())}catch(e){return null}}))).filter(Boolean);
  el.innerHTML=L.length?L.map(r=>`<div class="card"><b>${esc(r.title)}</b><div class="mut">${esc(r.per)}</div><div class="mut">Saved ${new Date(r.created).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} by ${esc(String(r.by||'').split('@')[0])} · ${Math.max(1,Math.round(r.size/1024))} KB</div><div class="mut">${esc(r.kinds.join(', '))}</div><div class="seg" style="margin-top:8px"><button onclick="svView('${r.id}')">Preview</button><button onclick="svDl('${r.id}')">Download</button></div></div>`).join('')+'<p class="mut">Saved copies are shared with all partners and keep the figures exactly as they were when the PDF was created. They cannot be deleted.</p>':'<p class="mut">No saved PDFs yet. Every PDF printed by any partner is kept here.</p>'}
 catch(e){el.textContent='Saved reports could not be loaded.'}}
async function stoGet(id,n){const {data,error}=await sb.storage.from('reports').download(id+n);if(error)throw error;return data}
async function svView(id){try{const meta=JSON.parse(await (await stoGet(id,'.meta.json')).text()),snap=JSON.parse(await (await stoGet(id,'.snap.json')).text()),lg=await logoPng(),one=snap.ms.length==1,d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="mod" style="max-width:640px;background:#fff;color:#000;font-family:'Times New Roman',Times,serif"><div style="text-align:center"><img alt="" src="${lg}" width="96" height="96"><div style="font-size:22px;font-weight:700;font-style:italic;margin-top:6px">${esc(meta.title)}</div><div style="font-size:11px;font-weight:700;font-style:italic;margin-bottom:14px">${esc(meta.per)}</div></div>${snap.ms.map(x=>`${one?'':`<div style="font-weight:700;font-size:16px;margin-top:18px">${esc(x.name)}</div><div style="font-style:italic;font-size:12px">${esc(x.period)}</div>`}${ptbl(x)}${x.imgs.map(u=>`<img alt="" style="width:100%;margin-top:10px" src="${u}">`).join('')}`).join('')}<div class="seg" style="margin-top:16px"><button id="pc">Close</button><button class="on" id="pd">Download PDF</button></div></div>`;
 document.body.appendChild(d);d.querySelector('#pc').onclick=()=>d.remove();d.querySelector('#pd').onclick=()=>svDl(id)}catch(e){toast('That report could not be opened.')}}
async function svDl(id){try{const meta=JSON.parse(await (await stoGet(id,'.meta.json')).text()),blob=await stoGet(id,'.pdf'),dl=await claude.use('downloads');await dl.save({filename:meta.name||id+'.pdf',data:blob})}catch(e){if(!(e&&e.code=='declined'))toast('Download failed.')}}
boot();
</script></body></html>
